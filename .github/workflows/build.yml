name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    name: build ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.20.1"
            range: ">=1.20 <=1.20.1"
          - mc: "1.20.4"
            range: ">=1.20.2 <=1.20.4"
          - mc: "1.20.6"
            range: ">=1.20.5 <=1.20.6"
          - mc: "1.21.1"
            range: ">=1.21 <=1.21.1"
          - mc: "1.21.4"
            range: ">=1.21.2 <=1.21.4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Unzip newest source zip
        run: |
          ZIP=$(ls fpsboost*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          unzip -o "$ZIP" -d mod
      - name: Resolve Fabric versions
        id: v
        run: |
          MC="${{ matrix.mc }}"
          YARN=$(curl -fsS "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version')
          LOADER=$(curl -fsS "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[]|select(.stable)][0].version')
          API=$(curl -fsS "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" | grep -o "<version>[^<]*+$MC</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1)
          echo "yarn=$YARN loader=$LOADER api=$API"
          test -n "$YARN" && test -n "$LOADER" && test -n "$API"
          echo "yarn=$YARN" >> "$GITHUB_OUTPUT"
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: mod
        env:
          RANGE: ${{ matrix.range }}
        run: >
          gradle build
          -Pminecraft_version=${{ matrix.mc }}
          -Pyarn_mappings=${{ steps.v.outputs.yarn }}
          -Ploader_version=${{ steps.v.outputs.loader }}
          -Pfabric_version=${{ steps.v.outputs.api }}
          "-Pminecraft_range=$RANGE"
      - uses: actions/upload-artifact@v4
        with:
          name: fpsboost-${{ matrix.mc }}
          path: |
            mod/build/libs/*.jar
            !mod/build/libs/*-dev.jar
            !mod/build/libs/*-sources.jar
